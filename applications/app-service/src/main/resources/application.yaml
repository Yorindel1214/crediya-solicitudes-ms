server:
  port: 8081   # el 8080 lo usa el microservicio de Autenticación
spring:
  application:
    name: "crediya-solicitudes-ms"
  devtools:
    add-properties: false
  profiles:
    include: null
  datasource:
    url: "jdbc:postgresql://localhost:5434/crediya_solicitudes"
    username: "admin"
    password: "admin123"
    driverClassName: "org.postgresql.Driver"
  jpa:
    databasePlatform: "org.hibernate.dialect.PostgreSQLDialect"
springdoc:
  swagger-ui.path: "/swagger-ui.html"
  api-docs.path: "/v3/api-docs"
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8081,http://localhost:8000,http://localhost:8001"
# HU3: mismo secreto que el microservicio de Autenticación, para validar sus tokens
jwt:
  secreto: "${JWT_SECRETO:crediya-secreto-de-desarrollo-cambiar-en-produccion-2026}"
